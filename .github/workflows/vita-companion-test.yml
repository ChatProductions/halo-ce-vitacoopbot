name: Vita companion test build

# CI compilation only: not a release and not a substitute for Vita hardware tests.
# Validate the canonical branch and incoming pull requests automatically.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vita:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - name: Install host build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git python3 ninja-build clang lld curl ca-certificates
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Vita release
        run: python3 configure.py --lto off --pgo off --portable --release
      - name: Compile and package VPK
        run: ninja vita
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: haloce-vita-companion-test
          path: |
            build/vita/halo.vpk
            build/vita/eboot.bin
          if-no-files-found: error
          retention-days: 3
